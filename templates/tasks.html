<h1>All Tasks</h1>

{% for task in tasks %}
<div style="margin-bottom: 20px;">
    <h2>Task: {{ task.name }}</h2>
    <h3>Deadline: {{ task.date }}</h3>
    <h3>Status: {% if task.completed %}Completed{% else %}Not Completed{% endif %}</h3>

    <form action="/task/status_update/{{ task.id }}" method="post">
        <button type="submit">Mark as Completed</button>
    </form>
    {% if task.completed %}
    <p>✅ Task already completed!</p>
    {% endif %}
</div>
<hr>
{% endfor %}
